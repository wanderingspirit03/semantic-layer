name: semantic-trace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: semantic-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - name: Require advertised optional Python integrations
        run: |
          uv run --project packages/python --all-extras python - <<'PY'
          import agent_framework
          import crewai
          import haystack
          import llama_index
          PY
      - run: pnpm verify

  node-compatibility:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --filter './packages/**' --frozen-lockfile
      - name: Build all TypeScript packages
        run: pnpm -r --filter './packages/**' --if-present run build
      - name: Typecheck all TypeScript packages and capture compatibility suites
        run: |
          pnpm -r --filter './packages/**' --if-present run typecheck
          pnpm --filter semantic-layer-capture run typecheck:tests
      - name: Run core TypeScript tests
        run: |
          pnpm --filter semantic-layer-capture exec vitest run \
            tests/conformance_verifier.test.ts \
            tests/custom_agent.test.ts \
            tests/native_snapshot.test.ts \
            tests/otel_semantic_projection.test.ts \
            tests/runtime_behavior.test.ts \
            tests/semantic_projection_conformance.test.ts \
            tests/semantic_projector.test.ts \
            tests/semantic_trace_validation.test.ts \
            tests/semantic_trace_writer.test.ts \
            tests/source_ownership_behavior.test.ts
      - name: Run cloud, ingest, and OpenClaw package tests
        run: |
          pnpm --filter semantic-layer-cloud run test
          pnpm --filter @semantic-layer/cloud-ingest run test
          pnpm --filter semantic-layer-openclaw run test
          pnpm --filter semantic-layer-openclaw-setup run test
      - name: Run local capture-to-ingest E2E
        run: node scripts/cloud-integration.mjs e2e

  tavi-trigger-compatibility:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.16.0", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@8.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build the local capture and cloud packages
        run: |
          pnpm --filter semantic-layer-capture run build
          pnpm --filter semantic-layer-cloud run build
      - name: Test the exact Tavi OpenTelemetry versions
        run: |
          pnpm install --dir compat/otel-1.25 --ignore-workspace --frozen-lockfile
          pnpm --dir compat/otel-1.25 run test
      - name: Test the Trigger 4.4.4 attempt integration on its production runtime
        if: matrix.node-version == '22.16.0'
        run: |
          pnpm install --dir examples/tavi-trigger-attempt --ignore-workspace --frozen-lockfile
          pnpm --dir examples/tavi-trigger-attempt run test
          pnpm --dir examples/tavi-trigger-attempt run typecheck

  python-compatibility:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - name: Run core Python tests
        run: |
          uv run --isolated \
            --python ${{ matrix.python-version }} \
            --project packages/python \
            --extra dev \
            pytest \
              packages/python/tests/unit/test_conformance.py \
              packages/python/tests/unit/test_context_propagation.py \
              packages/python/tests/unit/test_custom_agent.py \
              packages/python/tests/unit/test_frozen_runtime.py \
              packages/python/tests/unit/test_manual_capture_v1.py \
              packages/python/tests/unit/test_permissions.py \
              packages/python/tests/unit/test_provider_adapters.py \
              packages/python/tests/unit/test_semantic_projection_conformance.py \
              packages/python/tests/unit/test_semantic_projector.py \
              packages/python/tests/unit/test_semantic_trace_validation.py \
              packages/python/tests/unit/test_semantic_trace_writer.py \
              packages/python/tests/unit/test_source_ownership.py

# Live GCP staging and native OpenClaw installation remain separately approved,
# credentialed release gates. Pull-request jobs exercise only local equivalents.
